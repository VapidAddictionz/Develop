    <script>
    // Remap WASD to Arrow Keys for Unity input (keydown + keyup)
    function remapKeyEvent(originalEvent, type) {
        const keyMap = {
            "w": "ArrowUp",
            "a": "ArrowLeft",
            "s": "ArrowDown",
            "d": "ArrowRight"
        };

        const mappedKey = keyMap[originalEvent.key.toLowerCase()];
        if (mappedKey) {
            originalEvent.preventDefault();

            const keyCodeMap = {
                "ArrowUp": 38,
                "ArrowDown": 40,
                "ArrowLeft": 37,
                "ArrowRight": 39
            };

            const newEvent = new KeyboardEvent(type, {
                key: mappedKey,
                code: mappedKey,
                keyCode: keyCodeMap[mappedKey],
                bubbles: true
            });

            window.dispatchEvent(newEvent);
        }
    }

    window.addEventListener("keydown", function (e) {
        remapKeyEvent(e, "keydown");
    });

    window.addEventListener("keyup", function (e) {
        remapKeyEvent(e, "keyup");
    });
</script>

<script>
// Data Protection Data
document.addEventListener('contextmenu', function(event) {
  event.preventDefault();
});

document.addEventListener('keydown', function(e) {
  // F12
  if (e.key === 'F12') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+Shift+I or Cmd+Option+I (Inspect Element)
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'i') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+Shift+C or Cmd+Shift+C (Element picker)
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+Shift+J or Cmd+Option+J (Console)
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'j') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+U or Cmd+U (View Source)
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') {
    e.preventDefault();
    return false;
  }
});
