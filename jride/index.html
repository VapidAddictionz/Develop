<!DOCTYPE html>  
<html>
    <head>  
        <meta charset="utf-8" />
      
        <title> Jetpack Joyride </title>
        <link rel="stylesheet" type="text/css" href="css/styles.css">
        <meta name="viewport" content="user-scalable=no"/>
        <script type="text/javascript" src="h5Sdk.js"></script>
        <script type="text/javascript" src="engine/phaser-3.24.1.min.js"></script>
        <script type="text/javascript" src="game3.js"></script>
    </head>
     <body>
        <div class="fontLoader" style="font-family: jetpackia;">-</div>
        <img id="rotate_image" src="img/HB_ic_rotateScreen.png" alt="rotate_screen" class="center">
        <div id="content">
            <div id="phaser-canvas"></div>
        </div>        
    <style id="injectStyles">html, body{ background: none !important; }</style>
<script>
(() => {
  const keys = new Set(['w','a','s','d',' ']);
  const down = new Set();
  let clicking = false;

  const mouse = t =>
    document.dispatchEvent(new MouseEvent(t, {
      bubbles: true,
      cancelable: true,
      button: 0,
      buttons: t === 'mousedown'
    }));

  const update = () => {
    if (down.size && !clicking) mouse('mousedown'), clicking = true;
    if (!down.size && clicking) mouse('mouseup'), clicking = false;
  };

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (!keys.has(k) || e.repeat) return;
    down.add(k); update(); e.preventDefault();
  });

  document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (!keys.has(k)) return;
    down.delete(k); update(); e.preventDefault();
  });

  window.addEventListener('blur', () => down.clear(), update());
})();
</script>
    	<script>
// Data Protection Data
document.addEventListener('contextmenu', function(event) {
  event.preventDefault();
});

document.addEventListener('keydown', function(e) {
  // F12
  if (e.key === 'F12') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+Shift+I or Cmd+Option+I (Inspect Element)
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'i') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+Shift+C or Cmd+Shift+C (Element picker)
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+Shift+J or Cmd+Option+J (Console)
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'j') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+U or Cmd+U (View Source)
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') {
    e.preventDefault();
    return false;
  }
});
</script>
 <script>
        // Prevent mouse wheel scroll
        window.addEventListener('wheel', function(e) {
            e.preventDefault(); // Block wheel scroll
        }, { passive: false });

        // Prevent touch move on mobile
        window.addEventListener('touchmove', function(e) {
            e.preventDefault(); // Block touch scroll
        }, { passive: false });

        // Prevent key press scroll (Arrow keys, Space, etc.)
        window.addEventListener('keydown', function(e) {
            const scrollKeys = ['ArrowUp', 'ArrowDown', 'Space', 'PageUp', 'PageDown', 'Home', 'End'];
            if (scrollKeys.includes(e.key)) {
                e.preventDefault(); // Block scroll keys
            }
        });
    </script>
</body>
</html>
