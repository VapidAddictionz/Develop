<!DOCTYPE html>  
<html>
    <head>  
        <meta charset="utf-8" />
      
        <title> Jetpack Joyride </title>
        <link rel="stylesheet" type="text/css" href="css/styles.css">
        <meta name="viewport" content="user-scalable=no"/>
        <script type="text/javascript" src="h5Sdk.js"></script>
        <script type="text/javascript" src="engine/phaser-3.24.1.min.js"></script>
        <script type="text/javascript" src="game3.js"></script>
    </head>
     <body>
        <div class="fontLoader" style="font-family: jetpackia;">-</div>
        <img id="rotate_image" src="img/HB_ic_rotateScreen.png" alt="rotate_screen" class="center">
        <div id="content">
            <div id="phaser-canvas"></div>
        </div>        
    <style id="injectStyles">html, body{ background: none !important; }</style>
    <script>
(() => {
  const mapKeys = new Set(['w', 'a', 's', 'd', ' ']);
  let isClicking = false;

  function simulateClick(type) {
    const event = new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      button: 0,  // Left mouse button
      buttons: 1  // Left mouse button down
    });
    document.dispatchEvent(event);
  }

  document.addEventListener('keydown', e => {
    if (mapKeys.has(e.key.toLowerCase()) && !isClicking) {
      isClicking = true;
      simulateClick('mousedown');  // Trigger mouse down
      e.preventDefault();
    }
  });

  document.addEventListener('keyup', e => {
    if (mapKeys.has(e.key.toLowerCase()) && isClicking) {
      isClicking = false;
      simulateClick('mouseup');  // Trigger mouse up
      e.preventDefault();
    }
  });
})();
</script>
    	<script>
// Data Protection Data
document.addEventListener('contextmenu', function(event) {
  event.preventDefault();
});

document.addEventListener('keydown', function(e) {
  // F12
  if (e.key === 'F12') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+Shift+I or Cmd+Option+I (Inspect Element)
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'i') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+Shift+C or Cmd+Shift+C (Element picker)
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+Shift+J or Cmd+Option+J (Console)
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'j') {
    e.preventDefault();
    return false;
  }
  
  // Ctrl+U or Cmd+U (View Source)
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') {
    e.preventDefault();
    return false;
  }
});
</script>
</body>
</html>
